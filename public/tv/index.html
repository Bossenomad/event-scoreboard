<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Live Scoreboard — Event Scoreboard</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulseGlow {
      0%   { text-shadow: 0 0 20px rgba(0, 200, 255, 0.4), 0 0 40px rgba(0, 200, 255, 0.2); }
      50%  { text-shadow: 0 0 40px rgba(0, 200, 255, 0.8), 0 0 80px rgba(0, 200, 255, 0.4), 0 0 120px rgba(0, 200, 255, 0.2); }
      100% { text-shadow: 0 0 20px rgba(0, 200, 255, 0.4), 0 0 40px rgba(0, 200, 255, 0.2); }
    }

    @keyframes slideInFromRight {
      from {
        opacity: 0;
        transform: translateX(80px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes subtlePulse {
      0%   { opacity: 0.6; }
      50%  { opacity: 1; }
      100% { opacity: 0.6; }
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a1a;
      color: #ffffff;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.8s ease-out;
    }

    /* --- Top branding bar --- */
    .branding {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 60px 0;
      flex-shrink: 0;
    }

    .branding h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8899bb;
    }

    .branding .emoji {
      font-size: 2.4rem;
      margin-right: 16px;
    }

    /* --- Prize pot section --- */
    .prize-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px 36px;
    }

    .prize-label {
      font-size: 2.4rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 6px;
      color: #66ccff;
      margin-bottom: 12px;
    }

    .prize-value {
      font-size: 10rem;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 200, 255, 0.4), 0 0 40px rgba(0, 200, 255, 0.2);
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
      transition: color 0.3s;
    }

    .prize-value.animating {
      animation: pulseGlow 1.5s ease-in-out;
    }

    .prize-subtitle {
      font-size: 1.4rem;
      color: #556688;
      margin-top: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* --- Divider --- */
    .divider {
      width: 80%;
      max-width: 1400px;
      height: 2px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, #334466 20%, #66ccff 50%, #334466 80%, transparent);
      flex-shrink: 0;
    }

    /* --- Leaderboard section --- */
    .leaderboard-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 36px 120px 48px;
      min-height: 0;
    }

    .leaderboard-title {
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #8899bb;
      text-align: center;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .leaderboard-table {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Table header */
    .lb-header {
      display: flex;
      align-items: center;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #556688;
      border-bottom: 1px solid #1a2040;
      flex-shrink: 0;
    }

    .lb-header .col-rank  { width: 100px; text-align: center; }
    .lb-header .col-name  { flex: 1; }
    .lb-header .col-club  { flex: 1; }
    .lb-header .col-score { width: 200px; text-align: right; }

    /* Table body */
    .lb-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 6px;
      padding-top: 8px;
    }

    /* Leaderboard row */
    .lb-row {
      display: flex;
      align-items: center;
      padding: 18px 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(20, 25, 50, 0.8), rgba(15, 20, 40, 0.6));
      border: 1px solid rgba(100, 140, 200, 0.1);
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1),
                  opacity 0.6s ease;
    }

    .lb-row.slide-in {
      animation: slideInFromRight 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    /* Rank 1 highlight */
    .lb-row.rank-1 {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 180, 0, 0.06));
      border-color: rgba(255, 215, 0, 0.25);
    }

    /* Rank 2 highlight */
    .lb-row.rank-2 {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.1), rgba(160, 160, 180, 0.05));
      border-color: rgba(192, 192, 192, 0.2);
    }

    /* Rank 3 highlight */
    .lb-row.rank-3 {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.1), rgba(180, 110, 40, 0.05));
      border-color: rgba(205, 127, 50, 0.2);
    }

    .col-rank {
      width: 100px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #66ccff;
    }

    .rank-1 .col-rank { color: #ffd700; }
    .rank-2 .col-rank { color: #c0c0c0; }
    .rank-3 .col-rank { color: #cd7f32; }

    .col-name {
      flex: 1;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 20px;
    }

    .col-club {
      flex: 1;
      font-size: 1.5rem;
      font-weight: 400;
      color: #7788aa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 20px;
    }

    .col-score {
      width: 200px;
      text-align: right;
      font-size: 2.4rem;
      font-weight: 800;
      color: #66ccff;
      font-variant-numeric: tabular-nums;
    }

    .rank-1 .col-score { color: #ffd700; }

    /* Empty state */
    .lb-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #334466;
      letter-spacing: 2px;
    }

    /* Connection status indicator */
    .connection-status {
      position: fixed;
      bottom: 16px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #334466;
      opacity: 0.6;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #27ae60;
    }

    .status-dot.disconnected {
      background: #e74c3c;
      animation: subtlePulse 2s ease-in-out infinite;
    }

    .status-dot.polling {
      background: #f39c12;
    }
  </style>
</head>
<body>
  <div class="branding">
    <span class="emoji" aria-hidden="true">🏒</span>
    <h1>Live Scoreboard</h1>
  </div>

  <section class="prize-section" aria-label="Prize pot">
    <div class="prize-label">Total Prize Pot</div>
    <div class="prize-value" id="prize-value" aria-live="polite">0</div>
    <div class="prize-subtitle">Points scored across all players</div>
  </section>

  <div class="divider" aria-hidden="true"></div>

  <section class="leaderboard-section" aria-label="Leaderboard">
    <div class="leaderboard-title">🏆 Top 5 Leaderboard</div>
    <div class="leaderboard-table" role="table" aria-label="Top 5 players">
      <div class="lb-header" role="row">
        <span class="col-rank" role="columnheader">Rank</span>
        <span class="col-name" role="columnheader">Player</span>
        <span class="col-club" role="columnheader">Club</span>
        <span class="col-score" role="columnheader">Score</span>
      </div>
      <div class="lb-body" id="leaderboard-body" role="rowgroup">
        <div class="lb-empty" id="leaderboard-empty">Waiting for scores…</div>
      </div>
    </div>
  </section>

  <div class="connection-status" aria-hidden="true">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Connected</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
