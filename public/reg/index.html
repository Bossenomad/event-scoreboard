<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blaze Registrering</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #A20020;
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 520px;
      background: #62001D;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 20px;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.45rem; }
    p { margin: 0 0 18px 0; color: rgba(255,255,255,0.9); }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.3);
      font-size: 1.1rem;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: #ED0000;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .msg { margin-top: 12px; min-height: 20px; font-size: 0.95rem; }
    .error { color: #ffd1d9; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>🔥 Registrera score</h1>
    <p>Detta är en separat aktivering (Blaze).</p>
    <form id="score-form">
      <label for="score">Poäng</label>
      <input id="score" name="score" type="number" min="1" max="100" step="1" placeholder="Ange poäng (1-100)" required>
      <button type="submit" id="submit-btn">Spara score</button>
      <div class="msg" id="message" aria-live="polite"></div>
    </form>
  </main>
  <script src="/reg/app.js?v=20260509-blazesync1"></script>
</body>
</html>
