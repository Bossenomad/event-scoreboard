<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blaze TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas {
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      background: #A20020;
      padding: 40px 56px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .title { text-transform: uppercase; letter-spacing: 3px; font-size: 1.8rem; font-weight: 800; text-align: center; }
    .pot { text-align: center; font-size: 6rem; font-weight: 900; line-height: 1; }
    .sub { text-align: center; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem; }
    .divider { height: 2px; background: rgba(255,255,255,.3); }
    .table-title { text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; font-weight: 800; text-align: center; }
    .head, .row {
      display: grid;
      grid-template-columns: 120px 1fr 220px;
      gap: 12px;
      align-items: center;
    }
    .head { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; opacity: .95; }
    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row {
      background: #62001D;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .row.top { background: #ED0000; }
    .score { text-align: right; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="title">Blaze Prispott</div>
    <div class="pot"><span id="pot">0</span> kr</div>
    <div class="sub">Separat från ordinarie tv/staff</div>
    <div class="divider"></div>
    <div class="table-title">Topplistan</div>
    <div class="head">
      <span>Plac.</span><span>Namn</span><span class="score">Poäng</span>
    </div>
    <div class="rows" id="rows"></div>
  </main>
  <script src="/blaze/app.js"></script>
</body>
</html>
