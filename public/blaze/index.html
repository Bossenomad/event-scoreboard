<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Topplistan Blaze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas {
      width: min(100vw, 177.78vh);
      aspect-ratio: 16 / 9;
      background: #A20020;
      padding: 36px 56px 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .title { text-transform: uppercase; letter-spacing: 3px; font-size: 1.6rem; font-weight: 800; text-align: center; }
    .pot { text-align: center; font-size: 6.5rem; font-weight: 900; line-height: 1; }
    .sub { text-align: center; text-transform: uppercase; letter-spacing: 2px; font-size: 1.25rem; font-weight: 800; }
    .divider { height: 2px; background: rgba(255,255,255,.3); }
    .table-title { text-transform: uppercase; letter-spacing: 3px; font-size: 2.1rem; font-weight: 900; text-align: center; }
    .head, .row {
      display: grid;
      grid-template-columns: 120px 1.2fr 1.2fr 220px;
      gap: 12px;
      align-items: center;
    }
    .head { font-size: 1.4rem; font-weight: 800; text-transform: uppercase; opacity: .95; }
    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row {
      background: #62001D;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .row.top { background: #ED0000; }
    .score { text-align: right; }
    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: rgba(255,255,255,.9);
      font-weight: 700;
      font-size: 1.05rem;
    }
    .logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="title">Tillsammans har vi samlat in</div>
    <div class="pot"><span id="pot">3 802</span> kr</div>
    <div class="sub">till vinnarens favoritförening</div>
    <div class="divider"></div>
    <div class="table-title">Topplistan</div>
    <div class="head">
      <span></span><span>Namn</span><span>Favoritförening</span><span class="score">Poäng</span>
    </div>
    <div class="rows" id="rows">
      <div class="row top"><span>#1</span><span>Peter O</span><span>RBK</span><span class="score">53</span></div>
      <div class="row"><span>#2</span><span>Victor</span><span>RBK T14</span><span class="score">52</span></div>
      <div class="row"><span>#3</span><span>William L</span><span>Varberg Vipers</span><span class="score">52</span></div>
      <div class="row"><span>#4</span><span>Daniel L</span><span>Harryda HC</span><span class="score">49</span></div>
      <div class="row"><span>#5</span><span>Fredrik</span><span>Djurgarden IF</span><span class="score">49</span></div>
    </div>
    <footer class="footer">
      <span id="updated-at">Fast data</span>
      <img class="logo" src="https://are-leaderboard.vercel.app/assests/ski-team-sweden-stolt-sponsor.png" alt="Ski Team Sweden">
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
