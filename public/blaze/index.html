<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Topplistan Blaze</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }
    .canvas {
      width: 1080px;
      height: 1920px;
      aspect-ratio: 9 / 16;
      background: #A20020;
      padding: 28px 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
      --blaze-fit-scale: 1;
      --blaze-rotate-deg: 0deg;
      transform: rotate(var(--blaze-rotate-deg)) scale(var(--blaze-fit-scale));
      transform-origin: center center;
    }
    .title { text-transform: uppercase; letter-spacing: 2px; font-size: 2.35rem; font-weight: 800; text-align: center; }
    .hero-icon {
      width: 220px;
      height: 220px;
      object-fit: contain;
      margin: 0 auto 4px auto;
    }
    .pot { text-align: center; font-size: 9.74rem; font-weight: 900; line-height: 1; }
    .sub { text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 1.88rem; font-weight: 800; }
    .divider { height: 2px; background: rgba(255,255,255,.3); margin-top: 4px; }
    .table-title { text-transform: uppercase; letter-spacing: 2px; font-size: 3.44rem; font-weight: 900; text-align: center; }
    .head, .row {
      display: grid;
      grid-template-columns: 62px minmax(0, 1.15fr) minmax(0, 1.3fr) 74px;
      gap: 8px;
      align-items: center;
    }
    .head {
      font-size: 1.44rem;
      font-weight: 800;
      text-transform: uppercase;
      opacity: .95;
    }
    .rows { display: flex; flex-direction: column; gap: 8px; }
    .row {
      background: #62001D;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      padding: 8px 8px;
      font-size: 1.75rem;
      font-weight: 800;
    }
    .row.top { background: #ED0000; }
    .row span,
    .head span {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .head span:nth-child(2),
    .head span:nth-child(3),
    .head span:nth-child(4) {
      letter-spacing: 0.5px;
    }
    .row span:nth-child(3) {
      font-size: 1.61rem;
    }
    .score { text-align: right; }
    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      color: rgba(255,255,255,.9);
      font-weight: 700;
      font-size: 1.43rem;
    }
    .logo {
      height: 220px;
      width: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="canvas">
      <img class="hero-icon" src="/blaze/hand-icon.svg?v=20260509-blazeicon1" alt="" aria-hidden="true">
      <div class="title">Tillsammans har vi samlat in</div>
      <div class="pot"><span id="pot">5 376</span> kr</div>
      <div class="sub">till vinnarens favoritförening</div>
      <div class="divider"></div>
      <div class="table-title">Topplistan</div>
      <div class="head">
        <span></span><span>Namn</span><span>Favoritförening</span><span class="score">Poäng</span>
      </div>
      <div class="rows" id="rows">
        <div class="row top"><span>#1</span><span>Peter O</span><span>RBK</span><span class="score">53</span></div>
        <div class="row"><span>#2</span><span>Victor</span><span>RBK T14</span><span class="score">52</span></div>
        <div class="row"><span>#3</span><span>William L</span><span>Varberg Vipers</span><span class="score">52</span></div>
        <div class="row"><span>#4</span><span>Martin</span><span>Borås HC</span><span class="score">50</span></div>
        <div class="row"><span>#5</span><span>Daniel L</span><span>Harryda HC</span><span class="score">49</span></div>
      </div>
      <footer class="footer">
        <img class="logo" src="https://are-leaderboard.vercel.app/assests/ski-team-sweden-stolt-sponsor.png" alt="Ski Team Sweden">
      </footer>
    </main>
  </div>
  <script src="/blaze/app.js?v=20260509-blazefix3"></script>
</body>
</html>
